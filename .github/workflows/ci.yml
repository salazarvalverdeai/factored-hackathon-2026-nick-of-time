# CI for every pull request and every push to main (CONTRIBUTING.md §8).
# Offline only: no real LLM, no real gold (tests use fixtures). Target: under 5 minutes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python · pytest
    runs-on: ubuntu-latest
    # Throwaway CI-only database: the credentials below are not secrets and exist only inside this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: nickoftime_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_only -d nickoftime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_only:ci_only_not_a_secret@localhost:5432/nickoftime_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # The PostgresStore suite must run in CI, never skip: fail if any `postgres`-marked test is skipped or none ran.
      - name: PostgresStore suite ran (no skips)
        run: |
          python -m pytest -m postgres -q -rs | tee postgres-suite.log
          if grep -Eq '[0-9]+ skipped' postgres-suite.log; then echo "::error::postgres tests were skipped"; exit 1; fi
          grep -Eq '[0-9]+ passed' postgres-suite.log

  web:
    name: web · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    name: python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.0
      - run: ruff check .

  ac-coverage:
    name: specs · AC coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Implemented specs fail on a [T] criterion without a test; Approved / In progress only warn.
      - run: python scripts/ci/ac_coverage.py
