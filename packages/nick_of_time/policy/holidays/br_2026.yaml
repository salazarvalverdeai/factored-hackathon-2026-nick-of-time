# [external] Brazil 2026 non-business days for financial operations (Resolução CMN 4.880/2020, art. 6): national holidays
# (Lei 662/1949, Lei 6.802/1980, Lei 14.759/2023 at planalto.gov.br), Carnival Monday and Tuesday and Corpus Christi
# (Easter Sunday 2026-04-05). Weekends are skipped by the clock.
# [assumption] Conservative: Good Friday (04-03) is a municipal holiday (Lei 9.093/1995, art. 2), not listed by art. 6, so
# it counts as a business day and a deadline can only come earlier than the legal one, never later.
source: "Resolução CMN 4.880/2020, art. 6, and the federal holiday laws"
