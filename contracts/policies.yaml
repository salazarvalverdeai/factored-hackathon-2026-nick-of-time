# policies.yaml — policy engine outside the model. Version every change (git). The LLM never reads or edits this file.
version: 1
default: deny            # nothing runs unless a rule allows it

identity:
  session_ttl_minutes: 15
  require_otp_for: [block_card, open_case, search_transaction]
  document_alone_authenticates: false     # challenge rule: an ID number or customer_id alone does not prove identity

scope:
  only_own_products: true                 # the tool filters by the session's customer_id; it is not a prompt
  cross_customer_request: deny_and_log    # "show me another customer's account" → DENY with policy_id

scoring:                                 # where the fraud_score read by the zones comes from
  provider: dataset                      # dataset | rules | model | llm
  providers:
    dataset: {note: "reads transactions.fraud_score from gold for preset transactions; demo default", version: "gold-v1"}
    rules:   {note: "heuristic: amount vs the customer's p95, channel, hour, different country; no training", version: "rules-v0"}
    model:   {note: "plan B: GBM/LR on transactions features against is_fraud, temporal held-out; only if Slack says the score is not available in real time", version: "model-v0"}
    llm:     {note: "demo illustration only; NEVER decides a block (zone forced to human when it is the source)", version: "llm-v0"}
  record_source_in_audit: true           # source and version go to the audit log and the handoff card
  null_score_zone: human

zones:                                   # on the score returned by scoring.provider (0–100). Thresholds: EDA Sep 26 [data]
  high:   {score_min: 50, score_max: 100, note: "precision 100%, recall 48.8% on frauds with a score (38.7% of all); property of the synthetic generator"}
  medium: {score_min: 30, score_max: 49,  note: "precision at >=30: 79.6%"}
  human:  {score_min: 0,  score_max: 29,  include_null: true, note: "20.6% of frauds have no score"}

amount_gate:                             # [assumption] pending Q-AMT calibration
  # Only picks the approval mode (auto / manual_check / human_required); it never changes regulatory_clock.
  # The stricter of approval.per_action and the amount tier wins (auto < manual_check < human_required).
  amount: transactions.amount            # local currency; USD transactions (MX is 100% USD in the dataset) are converted first
  tiers: {up_to_low: auto, up_to_high: manual_check, above_high: human_required}
  by_country:                            # provisional values: low ≈ 1,000 USD, high ≈ 5,000 USD
    MX: {currency: MXN, low: 18000, high: 90000}          # 18.0 MXN/USD [assumption]: the dataset has no MXN; confirm with Diego (Q-AMT)
    CO: {currency: COP, low: 4000000, high: 20000000}     # 4,000 COP/USD, the dataset's fixed implied rate
    AR: {currency: ARS, low: 350000, high: 1750000}       # 350 ARS/USD, the dataset's fixed implied rate
    BR: {currency: BRL, low: 5500, high: 27500}           # 5.5 BRL/USD [assumption]: the dataset has no BR; confirm with Diego (Q-AMT)

approval:                                # approval mode per action: auto | human_required | manual_check
  supervised_mode: false                 # global switch in the console; true forces human_required everywhere; every change is audited
  per_action:
    open_case:          {high: auto, medium: auto, human: auto}                                 # logging a case is not a money decision
    block_card:         {high: manual_check, medium: human_required, human: human_required}     # high: runs and verifies now; the case stays in 'verification' until an analyst closes it
    provisional_credit: {high: human_required, medium: human_required, human: human_required}   # never auto
    unblock_card:       {high: human_required, medium: human_required, human: human_required}
  manual_check_leaves_case_in: verification  # with manual_check the action runs and the case stays in verification until a human signs off
  close: human_only                        # no case is closed without a person, automatic ones included

actions:
  ticket:             {zones: [high, medium, human], verify: get_case_status}         # always; the mode comes from approval.per_action.open_case
  block_card:         {zones: [high, medium], verify: get_product_status, expect: Blocked, medium_requires: customer_confirmation}
  provisional_credit: {zones: [], decided_by: human, note: "country obligation; never the model"}

actors:                                  # two tool sets that never cross; every call is audited with its actor
  customer: {via: mcp, tools: [search_transaction, get_fraud_score, compute_deadline, block_card, open_case, get_product_status, get_case_status]}
  analyst:  {via: api, tools: [list_cases, get_case, approve_credit, approve_block, unblock_card, request_customer_info, mark_ambiguous, close_case, reopen_case, supervised_mode], executed_by: human_only, copilot: proposes_only}

clarify:
  intent_confidence_min: 0.80            # below this, ask; τ is set on validation
  max_candidate_transactions: 3          # more candidates → ask for amount/date; if it persists → human
  max_clarification_turns: 2

contact:                                 # callback promise for request_call (D-008); the tool computes the time, never the LLM
  # [assumption] no external source exists for this bank-side SLA; conservative: within one business day.
  # Counted in the customer's country business calendar and time zone; absent or null means no time is promised.
  callback_within_business_hours: 8

handoff:
  triggers: [zone_human, amount_over_case_gate, identity_unverified, clarification_exhausted, tool_failure, language_low_confidence]
  payload_schema: contracts/handoff.schema.json
  never_include_raw_transcript: true

regulatory_clock:                        # [external] business days per the country's banking calendar; amount_gate never changes these
  MX:
    debit:
      # Source: Banxico Circular 3/2012, art. 19 Bis 3 (reviewed Mon Sep 28). See also CONDUSEF:
      # https://www.gob.mx/condusef/articulos/cargos-no-reconocidos?idiom=es
      # Provisional credit by business day 2 with no amount cap. The only exemption is a ruling within that term
      # proving two-factor authentication; without a ruling, the credit becomes final.
      source: "Banxico Circular 3/2012, art. 19 Bis 3"
      provisional_credit_business_days: 2
      amount_cap: none
      exemption: two_factor_authentication_ruling   # evidence proxy: handoff auth_evidence, derived from transactions.channel
      without_ruling: credit_becomes_final
    credit:
      # Source: LTOSF art. 23 (clarifications on credit products). The customer has 90 days to claim; ruling within
      # 45 days (180 if the charge was abroad); while pending, no payment of the claimed amount and no credit bureau
      # reporting. CONDUSEF maximum amounts for art. 23: pending.
      source: "LTOSF art. 23"
      customer_claim_days: 90
      ruling_days: 45
      ruling_days_abroad: 180
      while_pending: {no_payment_of_claimed_amount: true, no_credit_bureau_reporting: true}
  AR:
    # Source: BCRA — resolve and reimburse within 10 business days. https://www.bcra.gob.ar/archivos/Pdfs/texord/t-pusf.pdf
    source: "BCRA"
    resolve_and_reimburse_business_days: 10
  CO:
    # Source: SFC — answer within 15 days [not re-verified].
    # https://www.superfinanciera.gov.co/preguntas-frecuentes/3/3-derechos-de-peticion-ante-entidades-vigiladas/
    source: "SFC"
    response_days: 15
  BR:
    # Source: Resolução CMN 4.860 (2020), ombudsman (ouvidoria) within 10 business days [not re-verified].
    # Portuguese demo only; the dataset has no BR.
    source: "Resolução CMN 4.860 (2020)"
    ombudsman_business_days: 10
    extension_once: true

reliability:
  tool_retries: 2
  tool_timeout_ms: 800
  on_failure: escalate_with_unconfirmed_action   # never report an unverified action
  idempotency_key: "{session_id}:{transaction_id}:{action}"

security:
  prompt_injection: {strategy: "instructions and data kept apart; tools on an allowlist; customer text never changes permissions"}
  external_llm_data: {send_synthetic_only: true, confirm_in_slack: true}

case_queue:                              # analyst queue; a case's status is its last event in case_events
  states: [new, verification, review, resolved, closed]
  transitions:
    new:          [verification, review]          # verification = automatic action already executed; review = handoff without action
    verification: [resolved, review]
    review:       [resolved, review]              # request_customer_info keeps the case in review
    resolved:     [closed, review]                # reopen goes back to review
    closed:       []
  sla_hours: {verification: 4, review: 24}        # [assumption] for the demo; shown in the console
  ambiguous_queue: {state: review, tag: ambiguous, owner_required: true}
  deadline_sla:                                   # provisional_credit is always human_required, so a person must act before the MX debit deadline
    mx_debit:
      applies_to: {country: MX, product: debit}
      deadline: regulatory_clock.MX.debit.provisional_credit_business_days
      raise_priority_on_business_day: 1
      alert_before_business_day: 2

notifications:                           # what the customer receives in each status; every send is an event in case_events
  provider: log                          # log (customer panel "Mis notificaciones" in /chat, demo) | telegram (provisional if time allows) | email (mock)
  events:                                # templates are customer-facing, so they stay in Spanish/Portuguese
    case_opened:  {template: "Abrimos tu caso {case_id}. Plazo legal: {deadline}.", channels: [log, telegram]}
    card_blocked: {template: "Tu tarjeta {product_last4} quedó bloqueada (verificado). Caso {case_id}.", channels: [log, telegram]}
    in_review:    {template: "Un analista está revisando tu caso {case_id}.", channels: [log]}
    resolved:     {template: "Tu caso {case_id} fue resuelto: {outcome}.", channels: [log, telegram, email]}
  never_send: [transcript, score, policy_ids]      # the customer never receives internals

guardrails:                              # each lives in code; every DENY cites its id; each has a case in eval/
  - {id: G-IN-01, layer: input, name: "direct and indirect prompt injection", impl: "customer text and tool outputs as delimited data; injection classifier (rules + LR) → human zone", test: injection}
  - {id: G-IN-02, layer: input, name: "customer-invented data", impl: "amount/date/merchant only for searching; score, product and country come from gold", test: injection}
  - {id: G-IN-03, layer: input, name: "language and ambiguity", impl: "ES/PT detection with a threshold; low confidence → ask, then human", test: ambiguous}
  - {id: G-IN-04, layer: input, name: "PII and out of scope", impl: "PAN/CVV/password regex → reject and ask not to send it; topic outside disputes → abstain", test: out_of_scope}
  - {id: G-SES-01, layer: session, name: "identity and scope", impl: "mock OTP TTL 15 min; customer_id only from the session; expired → no data", test: session_expired}
  - {id: G-SES-02, layer: session, name: "access to another customer", impl: "the tool filters by session; DENY with policy_id", test: unauthorized_access}
  - {id: G-TOOL-01, layer: tools, name: "allowlist and strict schemas", impl: "the agent only sees customer tools; Pydantic rejects unexpected arguments; rate limit per session", test: unauthorized_access}
  - {id: G-TOOL-02, layer: tools, name: "controlled writes", impl: "approval mode per action; idempotency key; mandatory post-condition; credit never auto", test: tool_failure}
  - {id: G-POL-01, layer: policy, name: "default deny and logging", impl: "versioned policies.yaml; every denial is a row in policy_denials", test: all}
  - {id: G-OUT-01, layer: output, name: "grounding", impl: "every number, date, ID or status in the answer exists in a tool result or in the policy; otherwise it is dropped and logged", test: missing_data}
  - {id: G-OUT-02, layer: output, name: "verified only", impl: "'blocked' only when get_product_status == Blocked; 'case #' only when get_case_status == Open", test: tool_failure}
  - {id: G-OUT-03, layer: output, name: "leaks of other customers' data and secrets", impl: "output filter rejects IDs/amounts that are not from the session; never YAML or keys", test: unauthorized_access}
  - {id: G-OUT-04, layer: output, name: "tone and abstention", impl: "no promises of money or deadlines the policy did not give; explicit abstention", test: missing_data}
  - {id: G-OPS-01, layer: operations, name: "budget and retries", impl: "token cap per conversation and per day, checked before calling; 2 retries; 800 ms timeout", test: cap}
  - {id: G-OPS-02, layer: operations, name: "immutable audit", impl: "every event with actor, trace_id and input hash; nothing is deleted", test: inspection}

data_splits:                             # see contracts/gold_contract.md; the harness reads gold_eval only to score
  by_customer: {rule: "hash(customer_id) mod 10", train: [0,1,2,3,4,5,6], dev: [7], heldout: [8,9]}
  by_period:   {fit: "2025-06-01..2026-02-28", measure: "2026-03-01..2026-05-31"}
  heldout_seal: {day: "2026-10-01", how: "sha256 of the included customer and transaction IDs, in eval/heldout.sha256"}
