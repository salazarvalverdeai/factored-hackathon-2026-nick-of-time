# policies.yaml — policy engine outside the model. Version every change (git). The LLM never reads or edits this file.
version: 2               # 2: rules, scoring.deciding_sources, approval.money_actions, amount_gate usd_rate (spec 02 FR-07)
default: deny            # nothing runs unless a rule allows it

rules:                   # stable ids every decision cites (spec 02 §4.1, AC-12); the engine refuses to start if one it emits is missing
  POL-SESSION:           {text: "session expired or unverified -> reauthenticate, before any other rule", guardrail: G-SES-01}
  POL-INJECTION:         {text: "input flagged by the injection detector (spec 11) -> deny", guardrail: G-IN-01}
  POL-CROSS-CUSTOMER:    {text: "request targets another customer's data -> deny", guardrail: G-SES-02}
  POL-HUMAN-REQUEST:     {text: "intent human_request -> connect_person with a call request; never refused. If it also reports a charge on one card transaction the customer did not reject, and the intent confidence is at least clarify.intent_confidence_min, the call goes on that transaction's case, opened as the zone decides: the high zone blocks unless the block needs a person; otherwise the case goes to review with the zone's handoff reason. Below that confidence, only the call"}
  POL-STATUS:            {text: "intent status_inquiry -> answer_status; read-only, no case opened. If it also reports a charge and the customer has no active case, the turn goes on like a dispute (rules 4-9)"}
  POL-OUT-OF-SCOPE:      {text: "intent out_of_scope with no reported charge, or the identified transaction's product is not a card -> deny (polite abstention)", guardrail: G-IN-04}
  POL-CLARIFY:           {text: "intent confidence below clarify.intent_confidence_min, not exactly one candidate, or an out_of_scope intent that reports a charge -> ask", guardrail: G-IN-03}
  POL-CLARIFY-EXHAUSTED: {text: "still unclear after clarify.max_clarification_turns -> handoff (clarification_exhausted)", guardrail: G-IN-03}
  POL-SCORE-NULL:        {text: "no fraud score -> zone human; the case is still opened"}
  POL-SCORE-LLM:         {text: "score from the llm provider -> zone human; an LLM score never decides a block"}
  POL-SCORE-SOURCE:      {text: "score from a source not in scoring.deciding_sources -> zone human"}
  POL-ZONE-HIGH:         {text: "score in zones.high -> block_and_open_case, or a handoff (connect_person on a call request) when the block needs a person"}
  POL-ZONE-MEDIUM:       {text: "score in zones.medium -> confirm with the customer, then open the case and hand off proposing approve_block; a call request opens the case without asking; never a block"}
  POL-ZONE-HUMAN:        {text: "score in zones.human -> open the case and hand off (zone_human); no block"}
  POL-TICKET-ALWAYS:     {text: "open_case runs with mode auto in every zone; registering is not a money decision"}
  POL-AMOUNT-GATE:       {text: "the amount tier made a money action's approval mode stricter; it never changes a deadline", guardrail: G-TOOL-02}
  POL-AMOUNT-UNKNOWN:    {text: "no tier applies (country without a gate, amount missing, negative or not finite, other currency) -> human_required", guardrail: G-TOOL-02}
  POL-SUPERVISED:        {text: "supervised_mode forced human_required on a money action", guardrail: G-TOOL-02}
  POL-DEFAULT-DENY:      {text: "no rule allows the action -> deny", guardrail: G-POL-01}
  POL-CLOCK-UNKNOWN:     {text: "no verified regulatory_clock entry for the country -> case opened, no deadline, routed to a person"}
  POL-QUEUE-TRANSITION:  {text: "analyst transition not listed in case_queue.transitions -> deny", guardrail: G-POL-01}
  POL-CLOSE-HUMAN:       {text: "close requested by a non-human actor -> deny", guardrail: G-POL-01}
  POL-REEVAL-WINDOW:     {text: "re-evaluation requested after reevaluation.window_days -> deny; the agent offers a call", guardrail: G-POL-01}

identity:
  session_ttl_minutes: 15
  require_otp_for: [block_card, open_case, search_transaction]
  document_alone_authenticates: false     # challenge rule: an ID number or customer_id alone does not prove identity

scope:
  only_own_products: true                 # the tool filters by the session's customer_id; it is not a prompt
  cross_customer_request: deny_and_log    # "show me another customer's account" → DENY with policy_id

scoring:                                 # where the fraud_score read by the zones comes from
  provider: dataset                      # dataset | rules | model | llm; live-mode synthetic transactions carry their own score (synthetic)
  providers:
    dataset: {note: "reads transactions.fraud_score from gold for preset transactions; demo default", version: "gold-v1"}
    rules:   {note: "heuristic: amount vs the customer's p95, channel, hour, different country; no training", version: "rules-v0"}
    model:   {note: "plan B: GBM/LR on transactions features against is_fraud, temporal held-out; only if Slack says the score is not available in real time", version: "model-v0"}
    llm:     {note: "demo illustration only; NEVER decides a block (zone forced to human when it is the source)", version: "llm-v0"}
    synthetic: {note: "live mode only: the score generated with a labeled synthetic transaction in demo_transactions (ADR 0020); never in replay, eval or a pitch number; shown as [simulated] on the receipt, handoff and console", version: "synthetic-v0"}
  record_source_in_audit: true           # source and version go to the audit log and the handoff card
  null_score_zone: human
  deciding_sources: [dataset, rules, model, synthetic]   # only these place a score in a zone; any other source → zone human (spec 02 rule 6)

zones:                                   # on the score returned by scoring.provider (0–100). Thresholds: EDA Sep 26 [data]
  high:   {score_min: 50, score_max: 100, note: "precision 100%, recall 48.8% on frauds with a score (38.7% of all); property of the synthetic generator"}
  medium: {score_min: 30, score_max: 49,  note: "precision at >=30: 79.6%"}
  human:  {score_min: 0,  score_max: 29,  include_null: true, note: "20.6% of frauds have no score"}

amount_gate:                             # [assumption] pending Q-AMT calibration
  # Only picks the approval mode (auto / manual_check / human_required); it never changes regulatory_clock.
  # The stricter of approval.per_action and the amount tier wins (auto < manual_check < human_required).
  amount: transactions.amount            # local currency; USD transactions (MX is 100% USD in the dataset) are converted first
  tiers: {up_to_low: auto, up_to_high: manual_check, above_high: human_required}
  # usd_rate only converts a USD amount for these thresholds; it is never shown to a customer (spec 02 §4.2).
  # A country without an entry, a missing amount or a currency other than the entry's or USD → human_required [assumption].
  by_country:                            # provisional values: low ≈ 1,000 USD, high ≈ 5,000 USD; usd_rate converts USD amounts
    MX: {currency: MXN, usd_rate: 18.0, low: 18000, high: 90000}        # 18.0 MXN/USD [assumption]: the dataset has no MXN; confirm with Diego (Q-AMT)
    CO: {currency: COP, usd_rate: 4000, low: 4000000, high: 20000000}   # 4,000 COP/USD [data]: queries/policy/implied_usd_rate.sql
    AR: {currency: ARS, usd_rate: 350, low: 350000, high: 1750000}      # 350 ARS/USD [data]: queries/policy/implied_usd_rate.sql
    BR: {currency: BRL, usd_rate: 5.5, low: 5500, high: 27500}          # 5.5 BRL/USD [assumption]: the dataset has no BR; confirm with Diego (Q-AMT)

approval:                                # approval mode per action: auto | human_required | manual_check
  supervised_mode: false                 # global switch in the console; true forces human_required on money actions; every change is audited
  money_actions: [block_card, unblock_card, provisional_credit]   # amount tiers and supervised_mode apply only to these (spec 02 AC-15)
  per_action:
    open_case:          {high: auto, medium: auto, human: auto}                                 # logging a case is not a money decision
    block_card:         {high: manual_check, medium: human_required, human: human_required}     # high: runs and verifies now; the case stays in 'verification' until an analyst closes it
    provisional_credit: {high: human_required, medium: human_required, human: human_required}   # never auto
    unblock_card:       {high: human_required, medium: human_required, human: human_required}
  manual_check_leaves_case_in: verification  # with manual_check the action runs and the case stays in verification until a human signs off
  close: human_only                        # no case is closed without a person, automatic ones included

actions:
  ticket:             {zones: [high, medium, human], verify: get_case}       # always; the mode comes from approval.per_action.open_case
  block_card:         {zones: [high, medium], verify: get_product_status, expect: Blocked, medium_requires: customer_confirmation}
  provisional_credit: {zones: [], decided_by: human, note: "country obligation; never the model"}

actors:                                  # two tool sets that never cross; every call is audited with its actor
  customer: {via: mcp, tools: [get_customer_profile, search_transaction, get_fraud_score, compute_deadline, open_case,
                               block_card, get_product_status, list_my_cards, get_case, list_my_cases, add_case_info,
                               request_call, request_reevaluation, convert_amount, send_case_summary, list_my_notifications]}
  analyst:  {via: api, tools: [list_cases, get_console_case, approve_credit, approve_block, unblock_card, request_customer_info, mark_ambiguous, close_case, reopen_case, supervised_mode], executed_by: human_only, copilot: proposes_only}

clarify:
  intent_confidence_min: 0.80            # below this, ask; τ is set on validation
  max_candidate_transactions: 3          # more candidates → ask for amount/date; if it persists → human
  max_clarification_turns: 2

contact:                                 # callback promise for request_call (D-008); the tool computes the date, never the LLM
  # [assumption] no external source exists for this bank-side SLA; conservative: the next business day.
  # Counted from clock.today(mode, country) on spec 02's business-day calendar; absent or null means no date is promised.
  callback_within_business_days: 1

handoff:
  triggers: [zone_human, zone_medium, supervised_mode, amount_over_case_gate, identity_unverified, clarification_exhausted, tool_failure, language_low_confidence]
  payload_schema: contracts/handoff.schema.json
  never_include_raw_transcript: true

regulatory_clock:                        # [external] spec 02 §4.3; amount_gate never changes these. ADR 0019: every entry has source_url + verified_on
  # Per country and product (debit | credit | any), the first entry whose `when_charged_within` holds (or that has none) wins;
  # a country or product with no entry gets no deadline (POL-CLOCK-UNKNOWN). Terms count from the notice date
  # (clock.today); business days skip weekends and packages/nick_of_time/policy/holidays/{cc}_{year}.yaml.
  MX:
    debit:
      # Art. 19 Bis 3 fr. II: a claim of unrecognized charges filed within 90 Días (calendar days, art. 2) of the charge is
      # credited by the 2nd Día Hábil Bancario after the notice, with no amount cap; the bank may skip it only with a ruling
      # in that term proving two-factor authentication (evidence proxy: handoff auth_evidence). Art. 19 Bis 4: ruling
      # within 45 Días of the notice. Fr. I's 48 h window applies to theft or loss notices. Compiled text through
      # Circular 11/2026; CONDUSEF's 2018 press release summarizes it as "48 horas previas". [assumption] day 90 included.
      - when_charged_within: {days: 90}
        credit: {days: 2, calendar: business}
        ruling: {days: 45, calendar: calendar}
        source: "Banxico Circular 3/2012, arts. 19 Bis 3 and 19 Bis 4 (as amended by Circular 14/2018)"
        source_url: https://www.banxico.org.mx/marco-normativo/normativa-emitida-por-el-banco-de-mexico/circular-3-2012/%7B4E0281A4-7AD8-1462-BC79-7F2925F3171D%7D.pdf
        verified_on: 2026-10-04
      # LTOSF art. 23 fr. II (text in force, last reform DOF 2024-01-24): ruling within 45 days ("días", counted as calendar
      # days: the earlier date), 180 calendar days for operations abroad; claim within 90 calendar days of the statement
      # cut-off or the operation (fr. I; the cut-off date is not in the data, so the ruling is always given).
      - &ltosf_23
        ruling: {days: 45, calendar: calendar}
        ruling_abroad: {days: 180, calendar: calendar}
        source: "LTOSF art. 23"
        source_url: https://www.ordenjuridico.gob.mx/Documentos/Federal/pdf/wo46.pdf
        verified_on: 2026-10-04
    credit: [*ltosf_23]                  # while pending: no payment of the claimed amount, no credit bureau reporting (fr. I, V)
  AR:
    any:
      # Texto ordenado al 2026-05-06 (Com. "A" 8433): 2.3.5.1 reimburse improper charges within 10 business days of the
      # complaint; 3.1.6 resolve every complaint within 10 business days.
      - credit: {days: 10, calendar: business}
        ruling: {days: 10, calendar: business}
        source: "BCRA, Protección de los Usuarios de Servicios Financieros, items 2.3.5.1 and 3.1.6"
        source_url: https://www.bcra.gob.ar/archivos/Pdfs/texord/t-pusf.pdf
        verified_on: 2026-10-04

countries:                               # spec 02 §4.4 (FR-09): IANA time zone of clock.today(live); T7 adds currency and fx
  MX: {time_zone: America/Mexico_City}
  CO: {time_zone: America/Bogota}
  AR: {time_zone: America/Argentina/Buenos_Aires}
  BR: {time_zone: America/Sao_Paulo}
  PE: {time_zone: America/Lima}
  CL: {time_zone: America/Santiago}

reliability:
  tool_retries: 2
  tool_timeout_ms: 800
  on_failure: escalate_with_unconfirmed_action   # never report an unverified action
  idempotency_key: "{session_id}:{transaction_id}:{action}"

security:
  prompt_injection: {strategy: "instructions and data kept apart; tools on an allowlist; customer text never changes permissions"}
  external_llm_data: {send_synthetic_only: true, confirm_in_slack: true}

case_queue:                              # analyst queue; a case's status is its last event in case_events
  states: [new, verification, review, resolved, closed]
  transitions:
    new:          [verification, review]          # verification = automatic action already executed; review = handoff without action
    verification: [resolved, review]
    review:       [resolved, review]              # request_customer_info keeps the case in review
    resolved:     [closed, review]                # reopen goes back to review
    closed:       []
  sla_hours: {verification: 4, review: 24}        # [assumption] for the demo; shown in the console
  ambiguous_queue: {state: review, tag: ambiguous, owner_required: true}
  deadline_sla:                                   # provisional_credit is always human_required, so a person must act before the MX debit deadline
    mx_debit:
      applies_to: {country: MX, product: debit}
      deadline: regulatory_clock.MX.debit[0].credit           # 2 business days (clock.deadline)
      raise_priority_on_business_day: 1
      alert_before_business_day: 2

notifications:                           # what the customer receives in each status; every send is an event in case_events
  provider: log                          # log (customer panel "Mis notificaciones" in /chat, demo) | telegram (provisional if time allows) | email (mock)
  events:                                # templates are customer-facing, so they stay in Spanish/Portuguese
    case_opened:  {template: "Abrimos tu caso {case_id}. Plazo legal: {deadline}.", channels: [log, telegram]}
    card_blocked: {template: "Tu tarjeta {product_last4} quedó bloqueada (verificado). Caso {case_id}.", channels: [log, telegram]}
    in_review:    {template: "Un analista está revisando tu caso {case_id}.", channels: [log]}
    resolved:     {template: "Tu caso {case_id} fue resuelto: {outcome}.", channels: [log, telegram, email]}
  never_send: [transcript, score, policy_ids]      # the customer never receives internals

guardrails:                              # each lives in code; every DENY cites its id; each has a case in eval/
  - {id: G-IN-01, layer: input, name: "direct and indirect prompt injection", impl: "customer text and tool outputs as delimited data; injection classifier (rules + LR) → human zone", test: injection}
  - {id: G-IN-02, layer: input, name: "customer-invented data", impl: "amount/date/merchant only for searching; score, product and country come from gold", test: injection}
  - {id: G-IN-03, layer: input, name: "language and ambiguity", impl: "ES/PT detection with a threshold; low confidence → ask, then human", test: ambiguous}
  - {id: G-IN-04, layer: input, name: "PII and out of scope", impl: "PAN/CVV/password regex → reject and ask not to send it; topic outside disputes → abstain", test: out_of_scope}
  - {id: G-SES-01, layer: session, name: "identity and scope", impl: "mock OTP TTL 15 min; customer_id only from the session; expired → no data", test: session_expired}
  - {id: G-SES-02, layer: session, name: "access to another customer", impl: "the tool filters by session; DENY with policy_id", test: unauthorized_access}
  - {id: G-TOOL-01, layer: tools, name: "allowlist and strict schemas", impl: "the agent only sees customer tools; Pydantic rejects unexpected arguments; rate limit per session", test: unauthorized_access}
  - {id: G-TOOL-02, layer: tools, name: "controlled writes", impl: "approval mode per action; idempotency key; mandatory post-condition; credit never auto", test: tool_failure}
  - {id: G-POL-01, layer: policy, name: "default deny and logging", impl: "versioned policies.yaml; every denial is a row in policy_denials", test: all}
  - {id: G-OUT-01, layer: output, name: "grounding", impl: "every number, date, ID or status in the answer exists in a tool result or in the policy; otherwise it is dropped and logged", test: missing_data}
  - {id: G-OUT-02, layer: output, name: "verified only", impl: "'blocked' only when get_product_status == Blocked; 'case #' only when get_case returns the case_id with read_at", test: tool_failure}
  - {id: G-OUT-03, layer: output, name: "leaks of other customers' data and secrets", impl: "output filter rejects IDs/amounts that are not from the session; never YAML or keys", test: unauthorized_access}
  - {id: G-OUT-04, layer: output, name: "tone and abstention", impl: "no promises of money or deadlines the policy did not give; explicit abstention", test: missing_data}
  - {id: G-OPS-01, layer: operations, name: "budget and retries", impl: "token cap per conversation and per day, checked before calling; 2 retries; 800 ms timeout", test: cap}
  - {id: G-OPS-02, layer: operations, name: "immutable audit", impl: "every event with actor, trace_id and input hash; nothing is deleted", test: inspection}

data_splits:                             # see contracts/gold_contract.md; the harness reads gold_eval only to score
  by_customer: {rule: "hash(customer_id) mod 10", train: [0,1,2,3,4,5,6], dev: [7], heldout: [8,9]}
  by_period:   {fit: "2025-06-01..2026-02-28", measure: "2026-03-01..2026-05-31"}
  heldout_seal: {day: "2026-10-01", how: "sha256 of the included customer and transaction IDs, in eval/heldout.sha256"}
