# Customer-facing message templates (spec 04 §4.2 and §4.5, spec 03 get_case / send_case_summary, spec 01 §6.7).
# Changes only through a PR approved by the lead (CLAUDE.md rule 9).
#
# Conventions
# - Every leaf is a mapping with `es` (LATAM neutral Spanish) and `pt` (Brazilian Portuguese). Chip leaves also
#   carry `kind` (text | action | link), which the server sets, never the model (spec 04 AC-29, AC-32).
# - Placeholders use ONE syntax: {name}. The es and pt texts of a leaf use exactly the same set of names.
# - Placeholders are filled only with facts returned by tools (ADR 0016, grounding). Allowed names:
#   first_name (get_customer_profile) · case_id · ruling_deadline · credit_deadline · deadline_source (open_case,
#   get_case) · source_url · verified_on (spec 01 §6.7 deadline object) · amount · currency · merchant ·
#   display_amount · display_currency · rate · rate_source · as_of (convert_amount) · last4 · verification_id ·
#   verified_at · read_at · status_label · card_label · action_label (localized lookups of status.* below) ·
#   step_n · case_url · receipt_id · channel (masked, from the confirmed channels) · expected_contact_by
#   (request_call, YYYY-MM-DD computed by the tool)
# - Optional facts: a template that needs a fact the tool did not return is not rendered (null merchant uses the
#   *_no_merchant variants; a null deadline uses the deadline_unknown lines).
# - Tasks T2-T7 of spec 04 extend this file (clarify, refuse, cancel, progress labels AC-17, duplicate case AC-23,
#   re-evaluation AC-24, reversed charge); each extension is a contract change approved by the lead.
# - Chips: `kind` is static here; the action payload ({type}, spec 01 §6.4) is set by the server code.
# - Never a placeholder or text for the fraud score, policy ids, rule ids, zones or the transcript
#   (notifications.never_send in policies.yaml).
# - Never promise an outcome or a provisional credit: a person reviews and decides (CLAUDE.md rule 6).
# - Dates are absolute (YYYY-MM-DD) and come from tools; the template never computes them.
version: "0.1.0"

greet:
  # AC-15: first name from get_customer_profile, at most 3 capabilities, a person reviews what needs it.
  hello:
    es: "Hola, {first_name}. Soy el asistente de disputas de tu banco. Puedo:"
    pt: "Olá, {first_name}. Sou o assistente de contestações do seu banco. Posso:"
  capability_1:
    es: "- Ayudarte a reportar un cargo que no reconoces o que fue incorrecto."
    pt: "- Ajudar você a informar uma cobrança que não reconhece ou que foi indevida."
  capability_2:
    es: "- Bloquear tu tarjeta cuando corresponde y confirmar que quedó bloqueada."
    pt: "- Bloquear seu cartão quando for o caso e confirmar que ele foi bloqueado."
  capability_3:
    es: "- Mostrarte el estado de tus tarjetas y de tus casos."
    pt: "- Mostrar a situação dos seus cartões e dos seus casos."
  human_review:
    es: "Una persona revisa los casos que lo necesitan."
    pt: "Uma pessoa revisa os casos que precisam disso."

plan:
  # AC-16: numbered steps shown before acting. High zone executes; medium zone waits for confirmation.
  intro:
    es: "Esto es lo que voy a hacer:"
    pt: "Vou fazer o seguinte:"
  step_open_case:
    es: "{step_n}. Abrir un caso con la información de este cargo ({merchant}, {amount} {currency})."
    pt: "{step_n}. Abrir um caso com as informações desta cobrança ({merchant}, {amount} {currency})."
  step_open_case_no_merchant:
    es: "{step_n}. Abrir un caso con la información de este cargo ({amount} {currency})."
    pt: "{step_n}. Abrir um caso com as informações desta cobrança ({amount} {currency})."
  step_block_card:
    es: "{step_n}. Bloquear tu tarjeta terminada en {last4}."
    pt: "{step_n}. Bloquear seu cartão com final {last4}."
  step_verify:
    es: "{step_n}. Verificar que el bloqueo y el caso quedaron registrados."
    pt: "{step_n}. Verificar se o bloqueio e o caso foram registrados."
  step_deadline:
    es: "{step_n}. Mostrarte la fecha límite legal y su fuente."
    pt: "{step_n}. Mostrar a você o prazo legal e a sua fonte."
  step_person:
    es: "{step_n}. Pasar el caso a una persona, que lo revisa y decide."
    pt: "{step_n}. Encaminhar o caso a uma pessoa, que vai analisar e decidir."
  confirm_ask:
    es: "¿Quieres que continúe con estos pasos?"
    pt: "Quer que eu continue com estes passos?"

connect:
  # AC-28 and node `connect`: register a call request; never refuse, never promise an outcome.
  requested:
    # D-008: used when request_call returns expected_contact_by; the date comes from the tool, never computed here.
    es: "Listo, registré tu solicitud. Una persona te llamará a más tardar el {expected_contact_by}."
    pt: "Pronto, registrei seu pedido. Uma pessoa vai ligar para você até {expected_contact_by}."
  requested_no_window:
    # D-008: expected_contact_by is null (the policy has no window); no time is promised.
    es: "Listo, registré tu solicitud para que una persona te llame."
    pt: "Pronto, registrei seu pedido para que uma pessoa ligue para você."
  requested_case:
    # D-008: the active-case path, same date rule as `requested`.
    es: "Registré tu solicitud en el caso {case_id}. Una persona te llamará a más tardar el {expected_contact_by}."
    pt: "Registrei seu pedido no caso {case_id}. Uma pessoa vai ligar para você até {expected_contact_by}."
  requested_case_no_window:
    # D-008: expected_contact_by is null on the active-case path; no time is promised.
    es: "Registré tu solicitud en el caso {case_id}."
    pt: "Registrei seu pedido no caso {case_id}."
  # No verified session: general path with no customer data. [assumption] the bank's contact details are
  # not in the repo, so the wording points to the number printed on the card.
  general_contact:
    es: "No pude verificar tu sesión. Para hablar con una persona, usa el teléfono de atención que figura al reverso de tu tarjeta o la app o el sitio web de tu banco."
    pt: "Não consegui verificar sua sessão. Para falar com uma pessoa, use o telefone de atendimento que consta no verso do seu cartão ou o app ou site do seu banco."

status:
  # Customer status labels; must match spec 03 get_case (Recibido, En revisión, Resuelto, Cerrado).
  label:
    received:
      from: [new]   # case queue states (CLAUDE.md) that map to this label
      es: "Recibido"
      pt: "Recebido"
    in_review:
      from: [verification, review]   # case queue states (CLAUDE.md) that map to this label
      es: "En revisión"
      pt: "Em análise"
    resolved:
      from: [resolved]   # case queue states (CLAUDE.md) that map to this label
      es: "Resuelto"
      pt: "Resolvido"
    closed:
      from: [closed]   # case queue states (CLAUDE.md) that map to this label
      es: "Cerrado"
      pt: "Encerrado"
  # get_product_status values -> localized, with gender agreement (tarjeta f / cartão m).
  card_label:
    active:
      es: "activa"
      pt: "ativo"
    blocked:
      es: "bloqueada"
      pt: "bloqueado"
    closed:
      es: "cancelada"
      pt: "cancelado"
    suspended:
      es: "suspendida"
      pt: "suspenso"
  action_label:
    open_case:
      es: "Apertura del caso"
      pt: "Abertura do caso"
    block_card:
      es: "Bloqueo de la tarjeta"
      pt: "Bloqueio do cartão"
    request_call:
      es: "Solicitud de llamada"
      pt: "Pedido de ligação"
    send_case_summary:
      es: "Envío del comprobante"
      pt: "Envio do comprovante"
  # AC-19: re-read in the same turn and state the time of the reading; never state a status if the read failed.
  card_read:
    es: "Tu tarjeta terminada en {last4}: {card_label} (consultado el {read_at})."
    pt: "Seu cartão com final {last4}: {card_label} (consultado em {read_at})."
  # AC-06: followed by get_case's stored deadlines, each line only when present (MX debit has both);
  # deadline_unknown when both are null.
  case_read:
    es: "Estado de tu caso {case_id}: {status_label} (consultado el {read_at})."
    pt: "Situação do seu caso {case_id}: {status_label} (consultado em {read_at})."
  ruling_deadline:
    es: "Plazo legal del banco para resolver tu caso: {ruling_deadline}. Fuente: {deadline_source}."
    pt: "Prazo legal do banco para resolver seu caso: {ruling_deadline}. Fonte: {deadline_source}."
  credit_deadline:
    es: "Plazo legal del banco para pronunciarse sobre los fondos en disputa: {credit_deadline}. Fuente: {deadline_source}."
    pt: "Prazo legal do banco para se pronunciar sobre os valores contestados: {credit_deadline}. Fonte: {deadline_source}."
  deadline_unknown:
    es: "Aún no hay un plazo legal verificado para tu caso; una persona lo confirmará."
    pt: "Ainda não há um prazo legal verificado para o seu caso; uma pessoa vai confirmá-lo."
  read_failed:
    es: "No pude verificarlo ahora, así que prefiero no darte un estado que no confirmé. Intenta de nuevo en un momento."
    pt: "Não consegui verificar agora, então prefiro não informar uma situação que não confirmei. Tente novamente em instantes."
  # Four action states of AC-18; `verified` only after the post-condition read.
  action_in_progress:
    es: "{action_label}: en curso."
    pt: "{action_label}: em andamento."
  action_requested:
    es: "{action_label}: solicitud enviada."
    pt: "{action_label}: solicitação enviada."
  action_verified:
    es: "{action_label}: verificación confirmada ({verified_at})."
    pt: "{action_label}: verificação confirmada ({verified_at})."
  action_not_confirmed:
    es: "{action_label}: SIN CONFIRMAR. Una persona lo revisará."
    pt: "{action_label}: SEM CONFIRMAÇÃO. Uma pessoa vai revisar."

suggest:
  # Chips of spec 04 §4.5. Labels are the exact text sent for text chips (AC-32).
  report_unrecognized:
    kind: text
    es: "No reconozco un cargo"
    pt: "Não reconheço uma cobrança"
  report_duplicate:
    kind: text
    es: "Me cobraron dos veces"
    pt: "Me cobraram duas vezes"
  check_case:
    kind: text
    es: "¿Cómo va mi caso?"
    pt: "Como está meu caso?"
  none_of_these:
    kind: action
    es: "Ninguno de estos"
    pt: "Nenhuma dessas"
  show_recent:
    kind: text
    es: "Muéstrame mis últimos cargos"
    pt: "Mostre minhas últimas cobranças"
  dont_remember_amount:
    kind: text
    es: "No recuerdo el monto"
    pt: "Não lembro o valor"
  talk_to_person:
    kind: action
    es: "Hablar con una persona"
    pt: "Falar com uma pessoa"
  confirm_yes:
    kind: action
    es: "Sí, continúa"
    pt: "Sim, continue"
  confirm_no:
    kind: action
    es: "No es ese cargo"
    pt: "Não é essa cobrança"
  view_case:
    kind: link
    es: "Ver mi caso"
    pt: "Ver meu caso"
  send_summary:
    kind: action
    es: "Enviarme el comprobante"
    pt: "Me envie o comprovante"
  request_call:
    kind: action
    es: "Que me llame una persona"
    pt: "Quero que me liguem"
  add_info:
    kind: text
    es: "Agregar información"
    pt: "Adicionar informações"
  request_reevaluation:
    kind: action
    es: "Pedir reevaluación"
    pt: "Pedir reavaliação"
  report_another:
    kind: text
    es: "Reportar otro cargo"
    pt: "Informar outra cobrança"
  reauthenticate:
    kind: link
    es: "Verificar de nuevo"
    pt: "Verificar novamente"

receipt:
  # AC-21 / spec 01 §6.7: card last 4, verification id and time, case id, absolute deadline with legal source,
  # what the AI did and what a person does next. Rendered only from verified facts.
  title:
    es: "Comprobante de tu caso {case_id}"
    pt: "Comprovante do seu caso {case_id}"
  receipt_id:
    es: "Comprobante: {receipt_id}"
    pt: "Comprovante: {receipt_id}"
  transaction:
    es: "Cargo reportado: {merchant}, {amount} {currency}."
    pt: "Cobrança informada: {merchant}, {amount} {currency}."
  transaction_no_merchant:
    es: "Cargo reportado: {amount} {currency}."
    pt: "Cobrança informada: {amount} {currency}."
  # AC-25: exact original amount above; this approximation only when convert_amount returned a verified rate.
  transaction_display:
    es: "Equivale a unos {display_amount} {display_currency} (tasa {rate}, fuente {rate_source}, al {as_of})."
    pt: "Equivale a cerca de {display_amount} {display_currency} (taxa {rate}, fonte {rate_source}, em {as_of})."
  card_blocked:
    es: "Tarjeta terminada en {last4}: bloqueada y verificada (verificación {verification_id}, {verified_at})."
    pt: "Cartão com final {last4}: bloqueado e verificado (verificação {verification_id}, {verified_at})."
  # Deadlines (spec 01 §6.7): each rendered only when present. They are the bank's legal deadlines to respond,
  # never a promise of credit or of any outcome.
  ruling_deadline:
    es: "Plazo legal del banco para resolver tu caso: {ruling_deadline}. Fuente: {deadline_source} ({source_url}, verificada el {verified_on})."
    pt: "Prazo legal do banco para resolver seu caso: {ruling_deadline}. Fonte: {deadline_source} ({source_url}, verificada em {verified_on})."
  credit_deadline:
    es: "Plazo legal del banco para pronunciarse sobre los fondos en disputa: {credit_deadline}. Fuente: {deadline_source} ({source_url}, verificada el {verified_on})."
    pt: "Prazo legal do banco para se pronunciar sobre os valores contestados: {credit_deadline}. Fonte: {deadline_source} ({source_url}, verificada em {verified_on})."
  # Country without a verified clock entry (deadline is null).
  deadline_unknown:
    es: "Aún no hay un plazo legal verificado para tu caso; una persona lo confirmará."
    pt: "Ainda não há um prazo legal verificado para o seu caso; uma pessoa vai confirmá-lo."
  # Variant follows the verified block_card state (actions[].state), not the decision (AC-04, AC-18).
  what_ai_did_blocked:
    es: "Lo que hizo el asistente: abrió tu caso, bloqueó la tarjeta y verificó ambos pasos."
    pt: "O que o assistente fez: abriu seu caso, bloqueou o cartão e verificou as duas etapas."
  what_ai_did_case_only:
    es: "Lo que hizo el asistente: abrió tu caso y lo pasó a una persona."
    pt: "O que o assistente fez: abriu seu caso e o encaminhou a uma pessoa."
  what_ai_did_block_unconfirmed:
    es: "Lo que hizo el asistente: abrió tu caso e intentó bloquear la tarjeta, pero no pudo confirmarlo. Una persona lo revisa."
    pt: "O que o assistente fez: abriu seu caso e tentou bloquear o cartão, mas não conseguiu confirmar. Uma pessoa vai revisar."
  what_a_person_does:
    es: "Lo que sigue: una persona revisa tu caso y toma la decisión. Te avisaremos cada vez que cambie su estado."
    pt: "O que vem a seguir: uma pessoa revisa seu caso e toma a decisão. Avisaremos você a cada mudança de situação."
  case_link:
    es: "Sigue tu caso aquí: {case_url}"
    pt: "Acompanhe seu caso aqui: {case_url}"

notify:
  # Chat replies about send_case_summary (not part of the rendered receipt). accepted != verified:
  # delivered only when list_my_notifications shows sent/delivered (AC-26).
  send_requested:
    es: "Pedí el envío del comprobante a {channel}. Aún no figura como enviado; pregúntame en un momento y lo reviso."
    pt: "Pedi o envio do comprovante para {channel}. Ainda não consta como enviado; me pergunte daqui a pouco que eu verifico."
  send_delivered:
    es: "El comprobante figura como enviado a {channel}."
    pt: "O comprovante consta como enviado para {channel}."

refuse:
  # AC-03: injection or another customer's data. Never says why in policy terms; offers only the customer's own account.
  deny:
    es: "No puedo ayudarte con eso. Si quieres, cuéntame del cargo que no reconoces en tu propia cuenta."
    pt: "Não posso ajudar com isso. Se quiser, conte sobre a cobrança que você não reconhece na sua própria conta."

clarify:
  # Intent unclear: one question, no tool called yet.
  ask_what:
    es: "Cuéntame qué cargo no reconoces: comercio, monto y fecha aproximada."
    pt: "Conte qual cobrança você não reconhece: estabelecimento, valor e data aproximada."

cancel:
  # AC-11: the customer did not confirm the plan; nothing was executed.
  not_confirmed:
    es: "Entendido, no hice ningún cambio. Si cambias de idea, escríbeme de nuevo."
    pt: "Entendido, não fiz nenhuma alteração. Se mudar de ideia, escreva de novo."
