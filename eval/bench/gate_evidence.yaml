# Evidence for the third-party gate (spec 15 section 4.5), by provider, checked 2026-10-04 on the cited pages.
# A criterion with no entry here is "not documented" (which fails a production criterion). Overrides are per arm.
# Verdicts are written by gate.py from this file; nothing is pre-registered before the run.
providers:
  bedrock:
    synthetic_only:
      verdict: pass
      evidence_url: "docs/adr/0009 (internal: synthetic data only)"
      checked_on: "2026-10-04"
    no_training:
      verdict: pass
      evidence_url: https://aws.amazon.com/bedrock/security-compliance/
      note: "page: data is not shared with model providers and is not used to improve the base models"
      checked_on: "2026-10-04"
    certification:
      verdict: pass
      evidence_url: https://aws.amazon.com/bedrock/security-compliance/
      note: "page: Bedrock is in scope for ISO, SOC and CSA STAR Level 2"
      checked_on: "2026-10-04"
    retention:
      verdict: not documented
      evidence_url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
      note: "page linked from the data-protection page; not read on this date"
      checked_on: "2026-10-04"
    region:
      verdict: not documented
      evidence_url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
      note: "not read on this date; us. profiles may route across US regions"
      checked_on: "2026-10-04"
  typesafe:
    synthetic_only:
      verdict: pass
      evidence_url: "docs/adr/0009 (internal: synthetic data only)"
      checked_on: "2026-10-04"
    no_training:
      verdict: pass
      evidence_url: https://docs.typesafe.ai/legal.md
