<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Deployment architecture: one graph, two ways to run it</text>

  <!-- Shared core -->
  <rect x="40" y="60" width="1120" height="150" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="55" y="84" font-size="14" font-weight="bold" fill="#9a3412">SHARED CORE (same code in A and B): apps/api</text>
  <g font-size="12">
    <rect x="60" y="98" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="185" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">LangGraph graph (library)</text>
    <text x="185" y="138" text-anchor="middle" fill="#1f2937">understand → identity → retrieve →</text>
    <text x="185" y="154" text-anchor="middle" fill="#1f2937">decide → act → verify → escalate</text>
    <text x="185" y="172" text-anchor="middle" fill="#1f2937">no platform imports</text>

    <rect x="330" y="98" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="455" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Policy engine</text>
    <text x="455" y="138" text-anchor="middle" fill="#1f2937">policies.yaml · zones · amount</text>
    <text x="455" y="154" text-anchor="middle" fill="#1f2937">clock per country · deny by default</text>
    <text x="455" y="172" text-anchor="middle" fill="#1f2937">evaluated in the tools, not in the prompt</text>

    <rect x="600" y="98" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="725" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Intent classifier</text>
    <text x="725" y="138" text-anchor="middle" fill="#1f2937">rules → embeddings + LR → [Jev]</text>
    <text x="725" y="154" text-anchor="middle" fill="#1f2937">confidence &lt; τ → ask</text>
    <text x="725" y="172" text-anchor="middle" fill="#1f2937">[plan B: in-house fraud scoring]</text>

    <rect x="870" y="98" width="270" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="1005" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Harness held-out</text>
    <text x="1005" y="138" text-anchor="middle" fill="#1f2937">ES/PT cases + attacks · final state</text>
    <text x="1005" y="154" text-anchor="middle" fill="#1f2937">pass^4 · latency · cost · per language</text>
    <text x="1005" y="172" text-anchor="middle" fill="#1f2937">runs against A or against B via config</text>
  </g>

  <!-- Option A -->
  <rect x="40" y="240" width="550" height="470" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="266" font-size="15" font-weight="bold" fill="#1e3a8a">OPTION A · LangGraph Platform + MCP on EC2 (primary if Slack approves)</text>
  <g font-size="12">
    <rect x="60" y="284" width="510" height="90" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="75" y="306" font-weight="bold" fill="#1e3a8a">LangGraph Platform (LangChain cloud)</text>
    <text x="75" y="324" fill="#1f2937">graph deployed from langgraph.json · Studio · thread persistence</text>
    <text x="75" y="340" fill="#1f2937">streaming · interrupt() for the human · traces in LangSmith</text>
    <text x="75" y="358" fill="#1f2937">LLM: Bedrock via least-privilege role credentials (InvokeModel only)</text>

    <line x1="315" y1="374" x2="315" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="330" y="396" fill="#6b7280">MCP over HTTPS · API key or mTLS · IP allowlist</text>

    <rect x="60" y="414" width="510" height="150" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="75" y="436" font-weight="bold" fill="#1e3a8a">EC2 (data zone) · docker compose · Caddy TLS</text>
    <text x="75" y="456" fill="#1f2937">• MCP server (FastMCP): search_transaction · block_card · open_case · get_*_status</text>
    <text x="75" y="472" fill="#1f2937">   permissions by session customer_id INSIDE each tool · idempotency · post-condition</text>
    <text x="75" y="490" fill="#1f2937">• Mock identity (session + OTP, TTL 15 min)</text>
    <text x="75" y="506" fill="#1f2937">• DuckDB over gold Parquet (S3) · DynamoDB or SQLite for cases and audit</text>
    <text x="75" y="522" fill="#1f2937">• FastAPI: analyst console, /api/cases/{id}/action, audit, data pages</text>
    <text x="75" y="540" fill="#1f2937">• Next.js (web) served by Caddy</text>
    <text x="75" y="556" fill="#1f2937">• None of this is reachable without the session: web and MCP validate the same one</text>

    <rect x="60" y="580" width="510" height="116" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="75" y="602" font-weight="bold" fill="#991b1b">What to disclose and verify</text>
    <text x="75" y="620" fill="#1f2937">• Conversation text (synthetic) leaves AWS: state it in the README; ask on Slack</text>
    <text x="75" y="636" fill="#1f2937">• "Encrypted" = TLS in transit + per-call auth; the agent reads data, there is no E2E</text>
    <text x="75" y="652" fill="#1f2937">• +100–300 ms per tool call · one more point of failure · platform plan and region</text>
    <text x="75" y="670" fill="#1f2937">• Upside for the judges: "the tools are a bank service behind a gateway"</text>
    <text x="75" y="688" fill="#1f2937">• Switching to B does not touch the graph: only the tools adapter (MCP → direct import)</text>
  </g>

  <!-- Option B -->
  <rect x="610" y="240" width="550" height="470" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="266" font-size="15" font-weight="bold" fill="#166534">OPTION B · All on EC2 (fallback, or primary if Slack doesn't approve)</text>
  <g font-size="12">
    <rect x="630" y="284" width="510" height="280" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="645" y="306" font-weight="bold" fill="#166534">EC2 · docker compose (caddy + api + web) · images in GHCR</text>
    <text x="645" y="326" fill="#1f2937">• FastAPI with the LangGraph graph as a library (same core code)</text>
    <text x="645" y="342" fill="#1f2937">• Tools imported directly (no network): same functions the MCP exposes in A</text>
    <text x="645" y="358" fill="#1f2937">• Bedrock via the instance IAM role (no keys)</text>
    <text x="645" y="374" fill="#1f2937">• Mock identity · DuckDB over gold · DynamoDB or SQLite · audit</text>
    <text x="645" y="390" fill="#1f2937">• Analyst console and status transitions in the same API</text>
    <text x="645" y="406" fill="#1f2937">• Next.js served by Caddy with TLS on a domain</text>
    <text x="645" y="422" fill="#1f2937">• Traces: LangSmith in development (optional) + our own audit log, always</text>
    <text x="645" y="438" fill="#1f2937">• langgraph dev locally for Studio (video and debugging), without deploying the server</text>
    <text x="645" y="462" font-weight="bold" fill="#166534">Auto-deploy</text>
    <text x="645" y="480" fill="#1f2937">push to main → GitHub Actions → build → GHCR → ssh EC2 → compose pull &amp;&amp; up → smoke test</text>
    <text x="645" y="504" font-weight="bold" fill="#166534">Reproducible for the judges</text>
    <text x="645" y="522" fill="#1f2937">git clone · .env.example · docker compose up → everything with SQLite and local gold</text>
    <text x="645" y="540" fill="#1f2937">No data leaves the AWS account</text>

    <rect x="630" y="580" width="510" height="116" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="645" y="602" font-weight="bold" fill="#166534">What is lost and what is gained</text>
    <text x="645" y="620" fill="#1f2937">• Lost: Studio in production, managed thread persistence, one-click deploy</text>
    <text x="645" y="636" fill="#1f2937">• Gained: in-process tool call latency, a single point of failure, no external dependency</text>
    <text x="645" y="652" fill="#1f2937">• Thread persistence: LangGraph SQLite/DynamoDB checkpointer (one line)</text>
    <text x="645" y="670" fill="#1f2937">• Human interrupts: interrupt() works the same with the checkpointer</text>
    <text x="645" y="688" fill="#1f2937">• This is the one that runs no matter what; A is the showcase if time and Slack allow</text>
  </g>

  <text x="600" y="736" text-anchor="middle" font-size="12" fill="#6b7280">Rule: the graph and the tools are written once; A and B differ only in where the graph runs and how it calls the tools (MCP over the network vs direct import).</text>
</svg>
