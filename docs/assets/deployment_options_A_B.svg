<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Arquitectura de despliegue: un mismo grafo, dos formas de correrlo</text>

  <!-- Núcleo compartido -->
  <rect x="40" y="60" width="1120" height="150" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="55" y="84" font-size="14" font-weight="bold" fill="#9a3412">NÚCLEO COMPARTIDO (mismo código en A y B): apps/api</text>
  <g font-size="12">
    <rect x="60" y="98" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="185" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Grafo LangGraph (librería)</text>
    <text x="185" y="138" text-anchor="middle" fill="#1f2937">entender → identidad → recuperar →</text>
    <text x="185" y="154" text-anchor="middle" fill="#1f2937">decidir → actuar → verificar → escalar</text>
    <text x="185" y="172" text-anchor="middle" fill="#1f2937">sin imports de plataforma</text>

    <rect x="330" y="98" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="455" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Motor de políticas</text>
    <text x="455" y="138" text-anchor="middle" fill="#1f2937">policies.yaml · zonas · monto</text>
    <text x="455" y="154" text-anchor="middle" fill="#1f2937">reloj por país · deny por defecto</text>
    <text x="455" y="172" text-anchor="middle" fill="#1f2937">evaluado en las tools, no en el prompt</text>

    <rect x="600" y="98" width="250" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="725" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Clasificador de intención</text>
    <text x="725" y="138" text-anchor="middle" fill="#1f2937">reglas → embeddings + LR → [Jev]</text>
    <text x="725" y="154" text-anchor="middle" fill="#1f2937">confianza &lt; τ → preguntar</text>
    <text x="725" y="172" text-anchor="middle" fill="#1f2937">[plan B: scoring de fraude propio]</text>

    <rect x="870" y="98" width="270" height="96" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="1005" y="120" text-anchor="middle" font-weight="bold" fill="#9a3412">Harness held-out</text>
    <text x="1005" y="138" text-anchor="middle" fill="#1f2937">casos ES/PT + ataques · estado final</text>
    <text x="1005" y="154" text-anchor="middle" fill="#1f2937">pass^4 · latencia · costo · por idioma</text>
    <text x="1005" y="172" text-anchor="middle" fill="#1f2937">corre contra A o contra B por config</text>
  </g>

  <!-- Opción A -->
  <rect x="40" y="240" width="550" height="470" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="266" font-size="15" font-weight="bold" fill="#1e3a8a">OPCIÓN A · LangGraph Platform + MCP en EC2 (primaria si Slack aprueba)</text>
  <g font-size="12">
    <rect x="60" y="284" width="510" height="90" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="75" y="306" font-weight="bold" fill="#1e3a8a">LangGraph Platform (nube de LangChain)</text>
    <text x="75" y="324" fill="#1f2937">grafo desplegado desde langgraph.json · Studio · persistencia de hilos</text>
    <text x="75" y="340" fill="#1f2937">streaming · interrupt() para el humano · trazas en LangSmith</text>
    <text x="75" y="358" fill="#1f2937">LLM: Bedrock vía credenciales de rol con permiso mínimo (solo InvokeModel)</text>

    <line x1="315" y1="374" x2="315" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="330" y="396" fill="#6b7280">MCP sobre HTTPS · API key o mTLS · IP allowlist</text>

    <rect x="60" y="414" width="510" height="150" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="75" y="436" font-weight="bold" fill="#1e3a8a">EC2 (zona de datos) · docker compose · Caddy TLS</text>
    <text x="75" y="456" fill="#1f2937">• Servidor MCP (FastMCP): search_transaction · block_card · open_case · estado_*</text>
    <text x="75" y="472" fill="#1f2937">   permisos por customer_id de sesión DENTRO de cada tool · idempotencia · post-condición</text>
    <text x="75" y="490" fill="#1f2937">• Identidad mock (sesión + OTP, TTL 15 min)</text>
    <text x="75" y="506" fill="#1f2937">• DuckDB sobre gold Parquet (S3) · DynamoDB o SQLite para casos y auditoría</text>
    <text x="75" y="522" fill="#1f2937">• FastAPI: consola del analista, /api/cases/{id}/action, auditoría, páginas de datos</text>
    <text x="75" y="540" fill="#1f2937">• Next.js (web) servido por Caddy</text>
    <text x="75" y="556" fill="#1f2937">• Nada de esto es alcanzable sin la sesión: la web y el MCP validan la misma sesión</text>

    <rect x="60" y="580" width="510" height="116" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="75" y="602" font-weight="bold" fill="#991b1b">Qué hay que decir y verificar</text>
    <text x="75" y="620" fill="#1f2937">• El texto de la conversación (sintético) sale de AWS: declararlo en README; preguntar en Slack</text>
    <text x="75" y="636" fill="#1f2937">• "Cifrado" = TLS en tránsito + auth por llamada; el agente lee datos, no hay E2E</text>
    <text x="75" y="652" fill="#1f2937">• +100–300 ms por tool call · un punto de falla más · plan y región de la plataforma</text>
    <text x="75" y="670" fill="#1f2937">• Ventaja para el jurado: "las tools son un servicio del banco detrás de un gateway"</text>
    <text x="75" y="688" fill="#1f2937">• Cambiar a B no toca el grafo: solo el adaptador de tools (MCP → import directo)</text>
  </g>

  <!-- Opción B -->
  <rect x="610" y="240" width="550" height="470" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="266" font-size="15" font-weight="bold" fill="#166534">OPCIÓN B · Todo en EC2 (respaldo, o primaria si Slack no aprueba)</text>
  <g font-size="12">
    <rect x="630" y="284" width="510" height="280" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="645" y="306" font-weight="bold" fill="#166534">EC2 · docker compose (caddy + api + web) · imágenes en GHCR</text>
    <text x="645" y="326" fill="#1f2937">• FastAPI con el grafo LangGraph como librería (mismo código del núcleo)</text>
    <text x="645" y="342" fill="#1f2937">• Tools importadas directo (sin red): mismas funciones que expone el MCP en A</text>
    <text x="645" y="358" fill="#1f2937">• Bedrock por rol IAM de la instancia (sin claves)</text>
    <text x="645" y="374" fill="#1f2937">• Identidad mock · DuckDB sobre gold · DynamoDB o SQLite · auditoría</text>
    <text x="645" y="390" fill="#1f2937">• Consola del analista y transiciones de estado en la misma API</text>
    <text x="645" y="406" fill="#1f2937">• Next.js servido por Caddy con TLS en un dominio</text>
    <text x="645" y="422" fill="#1f2937">• Trazas: LangSmith en desarrollo (opcional) + log de auditoría propio siempre</text>
    <text x="645" y="438" fill="#1f2937">• langgraph dev en local para Studio (video y depuración), sin desplegar el server</text>
    <text x="645" y="462" font-weight="bold" fill="#166534">Auto-deploy</text>
    <text x="645" y="480" fill="#1f2937">push a main → GitHub Actions → build → GHCR → ssh EC2 → compose pull &amp;&amp; up → smoke test</text>
    <text x="645" y="504" font-weight="bold" fill="#166534">Reproducible para el jurado</text>
    <text x="645" y="522" fill="#1f2937">git clone · .env.example · docker compose up → todo con SQLite y gold local</text>
    <text x="645" y="540" fill="#1f2937">Ningún dato sale de la cuenta AWS</text>

    <rect x="630" y="580" width="510" height="116" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="645" y="602" font-weight="bold" fill="#166534">Qué se pierde y qué se gana</text>
    <text x="645" y="620" fill="#1f2937">• Se pierde: Studio en producción, persistencia de hilos gestionada, deploy en un clic</text>
    <text x="645" y="636" fill="#1f2937">• Se gana: latencia de tool call en proceso, un solo punto de falla, sin dependencia externa</text>
    <text x="645" y="652" fill="#1f2937">• Persistencia de hilos: checkpointer SQLite/DynamoDB de LangGraph (una línea)</text>
    <text x="645" y="670" fill="#1f2937">• Interrupciones humanas: interrupt() funciona igual con el checkpointer</text>
    <text x="645" y="688" fill="#1f2937">• Es la que corre sí o sí; A es la vitrina si el tiempo y Slack lo permiten</text>
  </g>

  <text x="600" y="736" text-anchor="middle" font-size="12" fill="#6b7280">Regla: el grafo y las tools se escriben una vez; A y B difieren solo en dónde corre el grafo y en cómo llama a las tools (MCP por red vs import directo).</text>
</svg>
