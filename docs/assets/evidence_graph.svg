<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Explicabilidad para el revisor: cada nodo es una fila del log de ejecución</text>

  <!-- Grafo (lado izquierdo, 0..760) -->
  <g font-size="12">
    <!-- fila 1 -->
    <rect x="40" y="90" width="150" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="112" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Cliente</text>
    <text x="115" y="132" text-anchor="middle" fill="#1f2937">C-48213 · MX · Basic</text>

    <rect x="230" y="90" width="150" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="305" y="112" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Producto</text>
    <text x="305" y="132" text-anchor="middle" fill="#1f2937">P-991 · Débito · Active</text>

    <rect x="420" y="90" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="515" y="112" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Transacción</text>
    <text x="515" y="132" text-anchor="middle" fill="#1f2937">T-77120 · 1,250 MXN · 24-sep</text>

    <rect x="650" y="90" width="110" height="56" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="705" y="112" text-anchor="middle" font-weight="bold" fill="#9a3412">fraud_score</text>
    <text x="705" y="132" text-anchor="middle" fill="#1f2937">72</text>

    <line x1="190" y1="118" x2="228" y2="118" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="380" y1="118" x2="418" y2="118" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="610" y1="118" x2="648" y2="118" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="209" y="108" text-anchor="middle" font-size="10" fill="#6b7280">posee</text>
    <text x="399" y="108" text-anchor="middle" font-size="10" fill="#6b7280">registra</text>
    <text x="629" y="108" text-anchor="middle" font-size="10" fill="#6b7280">tiene</text>

    <!-- intención -->
    <rect x="420" y="180" width="190" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="515" y="202" text-anchor="middle" font-weight="bold" fill="#4c1d95">Intención (LR)</text>
    <text x="515" y="222" text-anchor="middle" fill="#1f2937">cargo no reconocido · conf 0.91</text>
    <line x1="515" y1="180" x2="515" y2="148" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="545" y="166" font-size="10" fill="#6b7280">identificó</text>

    <!-- regla -->
    <rect x="650" y="180" width="110" height="56" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="705" y="202" text-anchor="middle" font-weight="bold" fill="#9a3412">Regla R-07</text>
    <text x="705" y="222" text-anchor="middle" fill="#1f2937">zona alta: ≥ 50</text>
    <line x1="705" y1="146" x2="705" y2="178" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="735" y="166" font-size="10" fill="#6b7280">disparó</text>

    <!-- acciones -->
    <rect x="420" y="290" width="190" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="515" y="312" text-anchor="middle" font-weight="bold" fill="#166534">Acción A-3301</text>
    <text x="515" y="332" text-anchor="middle" fill="#1f2937">block_card(P-991)</text>

    <rect x="650" y="290" width="110" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="705" y="312" text-anchor="middle" font-weight="bold" fill="#166534">Acción A-3302</text>
    <text x="705" y="332" text-anchor="middle" fill="#1f2937">open_case(T-77120)</text>

    <line x1="680" y1="236" x2="540" y2="288" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="705" y1="236" x2="705" y2="288" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="590" y="258" font-size="10" fill="#6b7280">ordenó</text>

    <!-- verificaciones -->
    <rect x="420" y="400" width="190" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="515" y="422" text-anchor="middle" font-weight="bold" fill="#166534">Verificación V-3301 ✓</text>
    <text x="515" y="442" text-anchor="middle" fill="#1f2937">product_status = Blocked</text>

    <rect x="650" y="400" width="110" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="705" y="422" text-anchor="middle" font-weight="bold" fill="#166534">Caso K-4471 ✓</text>
    <text x="705" y="442" text-anchor="middle" fill="#1f2937">estado = Abierto</text>

    <line x1="515" y1="346" x2="515" y2="398" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="705" y1="346" x2="705" y2="398" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="545" y="376" font-size="10" fill="#6b7280">verificó</text>
    <text x="735" y="376" font-size="10" fill="#6b7280">creó</text>

    <!-- plazo -->
    <rect x="420" y="500" width="340" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="590" y="522" text-anchor="middle" font-weight="bold" fill="#991b1b">Reloj regulatorio</text>
    <text x="590" y="542" text-anchor="middle" fill="#1f2937">MX débito · abono ≤ día hábil 2 · dictamen ≤ 45 días (CONDUSEF)</text>
    <line x1="705" y1="456" x2="705" y2="498" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
    <text x="735" y="480" font-size="10" fill="#6b7280">activa</text>

    <!-- log -->
    <rect x="40" y="290" width="340" height="266" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="55" y="312" font-weight="bold" fill="#111827">Traza de ejecución (OTel) · clic en un nodo abre su fila</text>
    <g font-family="Menlo, monospace" font-size="10.5" fill="#1f2937">
      <text x="55" y="336">12:04:01 invoke_agent  sess=S-2291  lang=es</text>
      <text x="55" y="354">12:04:01 classify      intent=no_reconocido p=0.91</text>
      <text x="55" y="372">12:04:02 execute_tool  search_transaction → T-77120</text>
      <text x="55" y="390">12:04:02 policy        R-07 zona=alta  ALLOW</text>
      <text x="55" y="408">12:04:03 execute_tool  block_card(P-991) → ok</text>
      <text x="55" y="426">12:04:03 verify        get_product_status → Blocked ✓</text>
      <text x="55" y="444">12:04:03 execute_tool  open_case → K-4471</text>
      <text x="55" y="462">12:04:04 sla           MX·debito  d2=26-sep d45=…</text>
      <text x="55" y="480">12:04:04 respond       solo hechos verificados</text>
      <text x="55" y="498">------ latencia e2e 2.9 s · costo 0.006 USD</text>
      <text x="55" y="530" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Sin chain-of-thought: la explicación son reglas y registros.</text>
    </g>
  </g>

  <!-- Tarjeta de handoff (lado derecho) -->
  <rect x="800" y="80" width="360" height="480" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="980" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Tarjeta de handoff · caso K-4471</text>
  <g font-size="12" fill="#1f2937">
    <text x="815" y="140" font-weight="bold">1 · Solicitud</text>
    <text x="815" y="158">Cargo no reconocido, 1,250 MXN, 24-sep, comercio X</text>
    <text x="815" y="190" font-weight="bold">2 · Hechos verificados</text>
    <text x="815" y="208">Identidad OK (OTP) · T-77120 pertenece a C-48213</text>
    <text x="815" y="226">fraud_score 72 · producto débito · país MX</text>
    <text x="815" y="258" font-weight="bold">3 · Acciones tomadas (con resultado)</text>
    <text x="815" y="276">Bloqueo P-991 ✓ verificado · Caso K-4471 ✓ abierto</text>
    <text x="815" y="308" font-weight="bold">4 · Evidencia</text>
    <text x="815" y="326">IDs: T-77120 · A-3301 · V-3301 · R-07 · traza S-2291</text>
    <text x="815" y="358" font-weight="bold">5 · Preguntas abiertas</text>
    <text x="815" y="376">¿Abono provisional? (regla MX: ≤ día hábil 2)</text>
    <text x="815" y="394">¿Reposición de tarjeta?</text>
    <text x="815" y="426" font-weight="bold" fill="#991b1b">Plazo que corre</text>
    <text x="815" y="444">Día hábil 2: 26-sep · Dictamen: 45 días</text>
  </g>
  <rect x="815" y="470" width="160" height="34" rx="6" fill="#16a34a"/>
  <text x="895" y="492" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Aprobar abono</text>
  <rect x="990" y="470" width="155" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1067" y="492" text-anchor="middle" font-size="12" fill="#1f2937">Pedir más datos</text>
  <text x="980" y="535" text-anchor="middle" font-size="11" fill="#6b7280">El copiloto propone; el humano decide. Nunca se vuelca el chat crudo.</text>

  <text x="600" y="600" text-anchor="middle" font-size="12" fill="#6b7280">Patrón de los referentes: Feedzai (explicación por señales) · Sardine (evidencia + doble revisión) · Nubank (copiloto con resumen) · τ-bench (estado final)</text>
</svg>
